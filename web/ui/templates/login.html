<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Login</title>
	<script>
		function handleResize() {
			const isMobile = window.innerWidth / window.innerHeight < 0.75;
			document.getElementById('login-box').style.display = isMobile ? 'none' : 'block';
			document.getElementById('mobile-warning').style.display = isMobile ? 'flex' : 'none';
		}
		window.onload = handleResize;
		window.onresize = handleResize;
	</script>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 1rem;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(to bottom right, #ebf8ff, #dbeafe);
		}

		#login-box {
			background-color: white;
			border: 1px solid #bfdbfe;
			border-radius: 1.5rem;
			box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
			padding: 2.5rem 2rem;
			max-width: 22rem;
			width: 100%;
			text-align: center;
		}

		#login-box img {
			width: 4rem;
			margin-bottom: 1rem;
			border-radius: 9999px;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
		}

		#login-box h3 {
			font-size: 1.5rem;
			font-weight: 600;
			color: #1e3a8a;
			margin-bottom: 0.5rem;
		}

		#login-box p {
			font-size: 0.9rem;
			color: #2563eb;
			margin-bottom: 1.5rem;
		}

		#qsLoginBtn {
			display: inline-block;
			width: 100%;
			padding: 0.65rem 1rem;
			background-color: #2563eb;
			color: white;
			font-weight: 500;
			border: none;
			border-radius: 0.75rem;
			cursor: pointer;
			text-decoration: none;
			transition: background-color 0.2s ease, box-shadow 0.2s ease;
			box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
		}

		#qsLoginBtn:hover {
			background-color: #1d4ed8;
		}

		#qsLoginBtn:active {
			background-color: #1e40af;
		}

		#mobile-warning {
			display: none;
			flex-direction: column;
			align-items: center;
			text-align: center;
			gap: 0.75rem;
			padding: 1.5rem;
			margin-top: 2rem;
			max-width: 22rem;
			width: 100%;
			background-color: #fef9c3;
			border: 1px solid #fde68a;
			border-radius: 1.25rem;
			box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
		}

		#mobile-warning h2 {
			font-size: 1.125rem;
			font-weight: 600;
			color: #92400e;
		}

		#mobile-warning p {
			color: #854d0e;
			font-size: 0.875rem;
		}

		#mobile-warning p:last-child {
			font-size: 0.75rem;
			font-style: italic;
			color: #a16207;
		}
	</style>
</head>
<body>
	<div id="login-box">
		<img src="https://i.cloudup.com/StzWWrY34s.png" alt="Logo">
		<h3>Welcome</h3>
		<p>Effortless identity for developers, powered by Auth0</p>
		<a id="qsLoginBtn" href="/login">Sign In</a>
	</div>

	<div id="mobile-warning">
		<h2>Whoa there, tiny screen!</h2>
		<p> You're trying to access this on a screen smaller ,Use a bigger screen and come back like a hero!</p>
		<p>I  promise, it's way cooler on a larger screen!</p>
	</div>
</body>
</html>
